<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sivence responsive QA</title><style>body{margin:20px;background:#252525;color:white;font:16px system-ui}iframe{border:1px solid #777;height:844px;display:block;background:#0e0f0d}nav{display:flex;gap:12px;margin:12px 0}button{padding:10px}#results{white-space:pre-wrap}</style></head><body><nav><button data-w="375">375 mobile</button><button data-w="390">390 mobile</button><button data-w="768">768 tablet</button><button data-w="1440">1440 desktop</button><button id="touch">Test touch and controls</button></nav><pre id="results"></pre><iframe src="/" title="Responsive Sivence viewport" width="390"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#results');
function check(){let d=f.contentDocument;out.textContent=JSON.stringify({viewport:f.contentWindow.innerWidth,document:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>f.contentWindow.innerWidth,fragmentCount:d.querySelectorAll('[data-fragment]').length,heroHeight:d.querySelector('.spatial-hero').getBoundingClientRect().height,soundOptIn:d.querySelector('[data-human-sound]').getAttribute('aria-pressed')},null,2)}
f.onload=check;document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;setTimeout(check,400)});
document.querySelector('#touch').onclick=()=>{let w=f.contentWindow,d=f.contentDocument,p=d.querySelector('[data-fragment="4"]');p.dispatchEvent(new w.PointerEvent('pointerdown',{pointerType:'touch',bubbles:true}));p.focus();p.dispatchEvent(new w.PointerEvent('click',{pointerType:'touch',bubbles:true}));let first=p.getAttribute('aria-pressed');p.dispatchEvent(new w.PointerEvent('pointerdown',{pointerType:'touch',bubbles:true}));p.dispatchEvent(new w.PointerEvent('click',{pointerType:'touch',bubbles:true}));let second=p.getAttribute('aria-pressed');d.querySelector('[data-human-motion]').click();let paused=d.querySelector('.human-stage').classList.contains('is-paused');d.querySelector('[data-human-replay]').click();let quiet=!d.querySelector('.human-stage').classList.contains('is-assembling');d.querySelector('[data-human-help]').click();let help=!d.querySelector('.human-help').hidden;out.textContent=JSON.stringify({touchOpens:first==='true',touchCloses:second==='false',pause:paused,replayRespectsPause:quiet,helpTooltip:help,allPassed:first==='true'&&second==='false'&&paused&&quiet&&help},null,2);d.querySelector('[data-human-motion]').click();};
</script></body></html>
